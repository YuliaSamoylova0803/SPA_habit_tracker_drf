name: Django CI/CD Pipeline with Poetry

on:  # ← Этот раздел должен быть сразу после name
  push:
    branches: [main, feature/course_9.0]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.13'
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/my_app

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: snok/install-poetry@v1
        with:
          version: '1.8.2'
          virtualenvs-create: false
      - run: poetry lock --no-update

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            ~/.local/bin
          key: ${{ runner.os }}-py${{ env.PYTHON_VERSION }}-poetry-${{ hashFiles('pyproject.toml') }}
      - run: poetry install --no-root --no-interaction
      - run: |
          poetry run isort .
          poetry run black .
          git diff --exit-code || (echo "::error::Run 'isort . && black .' locally"; exit 1)
      - run: poetry run flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: false
      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install psycopg2-binary

      - name: Prepare directories
        run: |
          mkdir -p static
          mkdir -p media

      - name: Run migrations
        env:
          NAME: test_db
          USER: postgres
          PASSWORD: postgres
          HOST: localhost
          PORT: 5432
          SECRET_KEY: django-insecure-test-key
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        env:
          NAME: test_db
          USER: postgres
          PASSWORD: postgres
          HOST: localhost
          PORT: 5432
          SECRET_KEY: django-insecure-test-key
          DEBUG: "True"
        run: |
          poetry run python manage.py test

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:latest

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:${{ github.sha }}

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            cd /path/to/project
            docker-compose down
            docker-compose pull
            docker-compose up -d --build
          "
