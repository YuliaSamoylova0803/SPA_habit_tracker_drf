name: Django CI/CD Pipeline with Poetry

on:  # ← Этот раздел должен быть сразу после name
  push:
    branches: [main, feature/course_9.0]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.13'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: snok/install-poetry@v1
        with:
          version: '1.8.2'
          virtualenvs-create: false
      - run: poetry lock --no-update

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Установка Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'  # Рекомендую стабильную версию

      # 2. Установка Poetry (исправленный способ)
      - name: Install Poetry
        run: |
          pip install poetry==1.8.2
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 3. Настройка Poetry
      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create false

      # 4. Установка зависимостей
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create true
          poetry install --no-root --no-interaction

      - name: Apply code formatting
        run: |
          poetry run isort .
          poetry run black .

      - name: Verify formatting
        run: |
          git diff --exit-code || (
            echo "::error::Файлы требуют форматирования. Запустите 'isort . && black .' локально"
            git diff
            exit 1
          )

      - name: Run linting
        run: |
          poetry run flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: false
      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install psycopg2-binary

      - name: Prepare directories
        run: |
          mkdir -p static
          mkdir -p media

      - name: Run migrations
        env:
          NAME: test_db
          USER: postgres
          PASSWORD: postgres
          HOST: localhost
          PORT: 5432
          SECRET_KEY: django-insecure-test-key
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        env:
          NAME: test_db
          USER: postgres
          PASSWORD: postgres
          HOST: localhost
          PORT: 5432
          SECRET_KEY: django-insecure-test-key
          DEBUG: "True"
        run: |
          poetry run python manage.py test

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:latest

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Настройка SSH-агента с ключом
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 2. Принудительное добавление сервера в known_hosts
      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_IP }} ssh-ed25519 SHA256:m5w+3ccpXnDmT9XCT10tFDrwIJLwe02HYZ665iOrf4w" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 3. Создание .env файла
      - name: Create environment file
        run: |
          cat << EOF > .env
          NAME=${{ secrets.DB_NAME }}
          PASSWORD=${{ secrets.DB_PASSWORD }}
          HOST=${{ secrets.DB_HOST }}
          PORT=${{ secrets.DB_PORT }}
          SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          EOF

      # 4. Деплой с проверками
      - name: Deploy application
        run: |
          # Проверка файлов перед отправкой
          ls -la .env docker-compose.yml || exit 1

          # Копирование с явным отключением проверки ключа
          scp -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              .env docker-compose.yml \
              ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_PATH }}/

          # Запуск контейнеров
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            set -e
            cd ${{ secrets.DEPLOY_PATH }} || { echo 'Directory error'; exit 1; }
            docker-compose down
            docker-compose pull
            docker-compose up -d --build
          "
