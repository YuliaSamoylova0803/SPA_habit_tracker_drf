name: Django CI/CD Pipeline with Poetry

on:
  push:
    branches: [main, feature/course_9.0]  # Добавьте свои ветки
  pull_request:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '1.8.2'  # Фиксируем версию для стабильности

      - name: Generate lock file
        run: |
          poetry lock --no-update
          git diff --exit-code poetry.lock || (echo "Poetry.lock is not synced with pyproject.toml" && exit 1)

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create true
          poetry install --no-interaction --no-root

      - name: Apply code formatting
        run: |
          poetry run isort .
          poetry run black .

      - name: Verify formatting
        run: |
          git diff --exit-code || (
            echo "::error::Файлы требуют форматирования. Запустите 'isort . && black .' локально"
            git diff
            exit 1
          )

      - name: Run linting
        run: |
          poetry run flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: |
          poetry install --with dev
          poetry run pip install psycopg2-binary

      - name: Prepare directories
        run: |
          mkdir -p static
          mkdir -p media

      - name: Run migrations
        env:
          NAME: test_db
          USER: postgres
          PASSWORD: postgres
          HOST: localhost
          PORT: 5432
          SECRET_KEY: django-insecure-test-key
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        env:
          NAME: test_db
          USER: postgres
          PASSWORD: postgres
          HOST: localhost
          PORT: 5432
          SECRET_KEY: django-insecure-test-key
          DEBUG: "True"
        run: |
          poetry run python manage.py test

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:latest

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:${{ github.sha }}

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          cd /path/to/project
          git pull origin main
          docker-compose down
          docker-compose pull
          docker-compose up -d --build
          docker-compose exec web python manage.py collectstatic --no-input
          docker-compose exec web python manage.py migrate
          EOF
